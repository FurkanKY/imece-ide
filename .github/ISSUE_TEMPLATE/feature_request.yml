name: Feature request
description: Propose a focused improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance
      description: Describe a focused user-visible result and how to tell it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: plan
    attributes:
      label: Related product-plan section (optional)
      placeholder: M2, M3, or link to the relevant section
