name: Secret scan

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history with redacted output
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$GITHUB_WORKSPACE:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml
          --redact --log-opts="--all" --report-format=sarif
          --report-path=/repo/gitleaks-results.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: redacted-gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: ignore
