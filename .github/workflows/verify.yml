name: Verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify isolated run state, mock concurrency, and task workspace
        env:
          CHROME_BIN: /usr/bin/google-chrome
          M2_SCREENSHOT_DIR: ${{ runner.temp }}/imece-m2
        run: |
          node scripts/run-state-acceptance.mjs
          node scripts/mock-runs-acceptance.mjs
          node scripts/task-workspace-acceptance.mjs
          node scripts/run-history-acceptance.mjs
          node scripts/run-retry-acceptance.mjs

  linux-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      IMECE_RUN_LIVE_API_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt offscreen platform runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxcb1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows-python:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      QT_QPA_PLATFORM: offscreen
      IMECE_RUN_LIVE_API_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run complete Windows suite across eight balanced test shards
        run: python -m pytest -v -o faulthandler_timeout=90 --ci-shard-index=${{ matrix.shard }} --ci-shard-count=8
