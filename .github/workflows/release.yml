name: M5 Windows and Linux package smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact app version tag, for example v0.4.0-beta.1
        required: true
        type: string
      publish:
        description: Publish only after actual acceptance; false produces engineering artifacts
        required: false
        default: false
        type: boolean
      acceptance_confirmed:
        description: Explicitly confirm supported-platform/provider and LAN acceptance before publication
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Keep deferred acceptance gates open
        env:
          PUBLISH: ${{ inputs.publish }}
          ACCEPTANCE_CONFIRMED: ${{ inputs.acceptance_confirmed }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$ACCEPTANCE_CONFIRMED" != true ]; then
            echo 'Publication requires explicit acceptance confirmation; use publish=false for engineering artifacts.' >&2
            exit 1
          fi

  package:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: python -m venv .venv
      - run: .venv\Scripts\python -m pip install --upgrade pip
      - run: .venv\Scripts\python -m pip install -r requirements-build.txt
      - name: Verify desktop and UI version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $Version = & .venv\Scripts\python packaging\check.py version --root .
          if ($LASTEXITCODE -ne 0) { throw 'Package version validation failed.' }
          if ($env:RELEASE_TAG -cne "v$Version") { throw 'Tag must exactly match the application version.' }
      - run: npm ci
        working-directory: web/ui
      - name: Build, license/provenance stage, frozen smoke, content audit and archive
        run: packaging\verify.ps1 -ArchiveName ImeceIDE-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImeceIDE-windows
          path: |
            dist/ImeceIDE-windows.zip
            dist/SHA256SUMS.txt
            dist/package-smoke.json
            dist/helper-smoke.json
            dist/artifact-audit.json
            dist/delivery-receipt.json
            dist/ImeceIDE/BUILD-INFO.json
            dist/ImeceIDE/DEPENDENCIES.json
            dist/ImeceIDE/package-manifest.json
            dist/ImeceIDE/_internal/licenses/inventory.json
            dist/ImeceIDE/_internal/licenses/native/inventory.json
      - name: Preserve smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ImeceIDE-windows-smoke-failure
          if-no-files-found: ignore
          path: |
            dist/helper-smoke.json
            dist/package-smoke.json
            dist/artifact-audit.json

  linux-package:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - name: Install build-runner Qt display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r requirements-build.txt
      - name: Verify desktop and UI version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(.venv/bin/python packaging/check.py version --root .)"
          test "$RELEASE_TAG" = "v$VERSION"
      - run: npm ci
        working-directory: web/ui
      - name: Build, license/provenance stage, frozen Xvfb smoke, content audit and archive
        env:
          IMECE_PACKAGE_ARCHIVE: ImeceIDE-linux.tar.gz
        run: xvfb-run -a bash packaging/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ImeceIDE-linux
          path: |
            dist/ImeceIDE-linux.tar.gz
            dist/SHA256SUMS.txt
            dist/package-smoke.json
            dist/helper-smoke.json
            dist/artifact-audit.json
            dist/delivery-receipt.json
            dist/ImeceIDE/BUILD-INFO.json
            dist/ImeceIDE/DEPENDENCIES.json
            dist/ImeceIDE/package-manifest.json
            dist/ImeceIDE/_internal/licenses/inventory.json
            dist/ImeceIDE/_internal/licenses/native/inventory.json
      - name: Preserve smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ImeceIDE-linux-smoke-failure
          if-no-files-found: ignore
          path: |
            dist/helper-smoke.json
            dist/package-smoke.json
            dist/artifact-audit.json

  publish:
    needs: [package, linux-package]
    if: ${{ inputs.publish && inputs.acceptance_confirmed }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ImeceIDE-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: ImeceIDE-linux
          path: release-assets/linux
      - run: cat release-assets/windows/SHA256SUMS.txt release-assets/linux/SHA256SUMS.txt > release-assets/SHA256SUMS.txt
      - name: Publish only after both package jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/windows/ImeceIDE-windows.zip release-assets/linux/ImeceIDE-linux.tar.gz release-assets/SHA256SUMS.txt --target "$RELEASE_SHA" --prerelease --title "$RELEASE_TAG" --notes "Public beta. The Windows package is unsigned and may trigger SmartScreen. Linux package targets Ubuntu 24.04 x86_64; other distributions are not certified. Install Git and selected provider/project toolchain prerequisites. Verify SHA256SUMS.txt."
